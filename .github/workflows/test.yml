name: Tests

# Reusable: called by build-image.yml so the published image is always gated on
# green tests. Also runs directly on pull requests. Deliberately not wired to
# `push` - build-image.yml already triggers on the feature branches we publish
# from, and a push trigger here would run the same suite twice.
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: src/Azure.DataApiBuilder.sln
  # Verify launches a diff tool per failing snapshot. On a headless runner that is at
  # best useless and at worst a hang, so keep it off and rely on the uploaded
  # *.received.* artifacts instead.
  DiffEngine_Disabled: 'true'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      # Everything that does not need a live database. Mirrors the filter used by
      # the upstream unit test pipeline in .pipelines/templates/build-pipelines.yml.
      - name: Run unit tests
        run: >
          dotnet test ${{ env.SOLUTION }} --no-build -c Release --verbosity normal
          --filter "TestCategory!=CosmosDb_NoSql&TestCategory!=MsSql&TestCategory!=PostgreSql&TestCategory!=MySql&TestCategory!=DwSql"

  cosmos-tests:
    name: Cosmos DB NoSQL integration tests
    runs-on: ubuntu-latest
    # Informational, not a gate. Upstream DAB's own suite does not run fully green, and the
    # emulator adds its own flakiness on top, so a red run here should not block publishing an
    # image. Read the result, don't let it stop the pipeline. Unit tests remain a hard gate.
    continue-on-error: true

    # The test config (src/Service.Tests/dab-config.CosmosDb_NoSql.json) points at
    # https://localhost:8081 with the emulator's well-known account key, so the
    # service container needs no further wiring.
    services:
      cosmosdb:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
          # Health probe endpoint. Required: the emulator regenerates its TLS certificate
          # during startup, so the certificate must not be captured before it reports ready.
          - 8080:8080
        env:
          PROTOCOL: https

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Observed taking ~6 minutes on a GitHub runner. The gateway on 8081 starts
      # accepting TLS connections long before this, which is why waiting on a successful
      # handshake is not enough - the certificate served then is later replaced.
      - name: Wait for the emulator to report ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/ready >/dev/null 2>&1; then
              echo "Emulator ready after $((attempt * 10))s"
              exit 0
            fi
            echo "Waiting for the Cosmos emulator readiness probe ($attempt/60)"
            sleep 10
          done
          echo "Cosmos emulator never became ready"
          curl -sS --max-time 5 http://localhost:8080/status || true
          exit 1

      # The .NET Cosmos SDK has no HTTP mode against the emulator, so the emulator's
      # self-signed certificate has to be trusted before any client can connect.
      - name: Trust the emulator certificate
        run: |
          sudo apt-get update && sudo apt-get install -y openssl
          openssl s_client -showcerts -connect localhost:8081 </dev/null 2>/dev/null \
            | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > cosmos_emulator.crt
          test -s cosmos_emulator.crt || { echo "Could not read the emulator certificate"; exit 1; }
          echo "Captured $(grep -c 'BEGIN CERTIFICATE' cosmos_emulator.crt) certificate(s)"
          sudo cp cosmos_emulator.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      - name: Run Cosmos DB NoSQL integration tests
        run: >
          dotnet test ${{ env.SOLUTION }} --no-build -c Release --verbosity normal
          --filter "TestCategory=CosmosDb_NoSql"

      # Verify's *.received files are the only useful artifact when a snapshot test
      # fails, and they are gone once the runner is torn down.
      - name: Upload Verify received files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-received
          path: '**/*.received.*'
          if-no-files-found: ignore
